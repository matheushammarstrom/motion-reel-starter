<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion reel — sample film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The display font. Load yours here (or self-host it) and name it in film.js's FONT. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<style>
  /* Tokens: copy them from your product's theme. One accent, and it belongs to the dot. */
  :root {
    --bg: #15151A; --card: #1E1E24; --accent: #2A2A32; --fg: #F2F2F0; --muted: #9A9AA3;
    --sec: #B3B3BB; --faint: #6B6B75; --border: #33333B; --primary: #4F7CFF;
    --success: #34C77B; --warning: #F5B942; --danger: #F05A5A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); overflow: hidden; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--fg);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .a { position: absolute; left: 0; top: 0; }
  #stage { overflow: hidden; background: var(--bg); }

  /* The set: flat dark, a faint grid, one soft light. Replace with your own set, never a stock gradient. */
  #grid {
    inset: 0;
    background-image:
      linear-gradient(rgba(242,242,240,.045) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(242,242,240,.045) 1.5px, transparent 1.5px);
    background-size: 96px 96px;
    -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 45%, #000 10%, transparent 72%);
  }
  #ember { inset: 0; background: radial-gradient(60% 34% at 88% 4%, rgba(79,124,255,.12), transparent 70%); }

  /* Display type */
  .disp { white-space: nowrap; font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
  .word { letter-spacing: -0.05em; }
  .strike { background: rgba(240,90,90,.9); border-radius: 99px; transform-origin: 0 50%; }
  .pd { border-radius: 50%; }

  /* Captions: each line rides up out of its own mask */
  .cap-line { overflow: hidden; white-space: nowrap; }
  .cap-line > span { display: block; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; }
  .cap-dot { display: inline-block; border-radius: 50%; background: var(--primary); }
  .eyebrow {
    border-radius: 999px; border: 2px solid rgba(79,124,255,.28); background: rgba(79,124,255,.1);
    overflow: hidden; white-space: nowrap; height: 64px;
  }
  .eyebrow span { font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--primary); line-height: 60px; padding: 0 30px; }

  #box { border-style: solid; box-shadow: 0 48px 90px -36px rgba(0,0,0,.85); }
  #dot { transform-origin: 50% 50%; overflow: hidden; }
  #dot .dl { position: absolute; left: 50%; top: 50%; white-space: nowrap; }

  /* ---- Product UI at the app's own sizes; each layer is zoomed to film scale ---- */
  .ui { font-size: 12px; line-height: 1.25; color: var(--fg); }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .tnum { font-variant-numeric: tabular-nums; }
  .roll { display: inline-flex; align-items: baseline; font-variant-numeric: tabular-nums; }
  .rc { position: relative; display: inline-block; clip-path: inset(0); }
  .rc .rg { visibility: hidden; }
  .rc .rs { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
  .rx { white-space: pre; }
  .ui svg { display: block; flex-shrink: 0; }
  .ui i.dot { display: inline-block; border-radius: 50%; flex-shrink: 0; }
  .ib { display: inline-block; }
  .btn { border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; color: #fff; white-space: nowrap; }
  .panel { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 56px), var(--card); border: 1px solid var(--border); border-radius: 16px; }
  .lm { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 10px; }
</style>
</head>
<body>
<div id="stage" class="a">
  <div id="bg" class="a" style="inset:0"><div id="grid" class="a"></div><div id="ember" class="a"></div></div>
  <div id="world" class="a" style="transform-origin:0 0"></div>
  <div id="type" class="a"></div>
  <div id="top" class="a"></div>
</div>
<script type="module" src="./film.js"></script>
</body>
</html>
